<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Over</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    #scare-container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      z-index: 10;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }

    #game-over-text {
      position: relative;
      z-index: 2;
      padding: 20px;
      display: none;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    #reset-box {
      position: relative;
      z-index: 3;
      margin-top: 20px;
      display: none;
    }

    input {
      padding: 10px 14px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="scare-container">
    <video id="scare-video" autoplay muted playsinline controls>
      <source src="jumpscaer for game.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>
  </div>

  <div id="game-over-text">
    <h1>GAME OVER</h1>
    <p>You made two wrong choices try better...</p>

    <div id="reset-box">
      <p>click <strong>End game</strong> to reset the game.</p>
       <input type="submit"  id="resetInput" value="End game" />
    </div>
  </div>

  <script>
    const scareContainer = document.getElementById("scare-container");
    const scareVideo = document.getElementById("scare-video");
    const gameOverText = document.getElementById("game-over-text");
    const resetBox = document.getElementById("reset-box");
    const resetInput = document.getElementById("resetInput");

    const endSoundFile = "Untitled Project.mp3"; 
    const endSound = new Audio(endSoundFile);
    endSound.preload = "auto";
    endSound.volume = 0.8;

    function playEndSound() {
      endSound.currentTime = 0;
      endSound.play().catch(() => {
        console.log("End sound blocked or missing.");
      });
    }

    let playbackCount = 0;
    scareVideo.muted = false; // Ensure the video is muted for autoplay
    scareVideo.volume = 1; // Set volume to 0 to avoid any sound issues
    scareVideo.playbackRate = 1.00; // Set playback rate to normal

    scareVideo.play().catch(() => {
      console.log("Autoplay was blocked. The video can still be played manually.");
    });

    scareVideo.addEventListener("ended", function() {
      playbackCount += 1;

      if (playbackCount >= 3) {
        scareVideo.pause();
        scareVideo.currentTime = 0;
        scareContainer.style.display = "none";
        gameOverText.style.display = "block";
        resetBox.style.display = "block";
        playEndSound();
        resetInput.focus();
      } else {
        scareVideo.currentTime = 0;
        scareVideo.play();
      }
    });

    resetInput.addEventListener("click", function(event) {
      scareVideo.pause();
      localStorage.removeItem("correctCount");
      localStorage.removeItem("incorrectCount");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
